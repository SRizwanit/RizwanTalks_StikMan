name: render

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Generate voiceover with edge-tts (true/false)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data/script.json"
      - "src/**"
      - "python/**"
      - "package.json"
      - ".github/workflows/render.yml"

permissions:
  contents: write   # needed only for the optional Release step

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: System libs for headless Chrome + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libcups2 \
            && (sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2)

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Install Python deps
        run: pip install -r python/requirements.txt

      - name: Build timeline (Python)
        run: |
          if [ "${{ inputs.voice }}" = "true" ]; then
            python python/build_timeline.py --voice
          else
            python python/build_timeline.py
          fi

      - name: Download browser for Remotion
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render src/index.ts Intro out/rizwantalks_intro.mp4 --codec h264 --crf 18

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rizwantalks_intro
          path: out/rizwantalks_intro.mp4
          retention-days: 30

      # Optional: attach the video to a GitHub Release (uncomment to use)
      # - name: Publish release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: intro-${{ github.run_number }}
      #     files: out/rizwantalks_intro.mp4
